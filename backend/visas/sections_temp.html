<!-- S8: U.S. POINT OF CONTACT -->
<h2>Sección 8: U.S. Point of Contact</h2>
<div class="section">
<div class="row"><div class="checkbox-group"><input type="checkbox" id="pocNameNA"><label for="pocNameNA">No conoce el nombre (Do Not Know)</label></div></div>
<div class="row"><div><label>Apellido</label><input type="text" id="pocSurname" placeholder="APELLIDO"></div><div><label>Nombre</label><input type="text" id="pocGivenName" placeholder="NOMBRE"></div></div>

<label>Relación con el solicitante</label>
<select id="pocRelationship"><option value="C">CO-WORKER</option><option value="E">EMPLOYER</option><option value="F">FRIEND</option><option value="G">GRANDPARENT</option><option value="H">SPOUSE</option><option value="O" selected>OTHER RELATIVE</option><option value="P">PARENT</option><option value="S">SCHOOL</option><option value="T">OTHER</option></select>
<div class="row"><div style="flex:2"><label>Dirección L1</label><input type="text" id="pocStreet1" placeholder="123 Disney Way"></div><div><label>L2</label><input type="text" id="pocStreet2"></div></div>
<div class="row">
<div><label>Ciudad</label><input type="text" id="pocCity" placeholder="Orlando"></div>
<div><label>Estado</label><select id="pocState"><option value="">-</option><option value="AL">AL</option><option value="AK">AK</option><option value="AZ">AZ</option><option value="AR">AR</option><option value="CA">CA</option><option value="CO">CO</option><option value="CT">CT</option><option value="DE">DE</option><option value="FL" selected>FL</option><option value="GA">GA</option><option value="HI">HI</option><option value="ID">ID</option><option value="IL">IL</option><option value="IN">IN</option><option value="IA">IA</option><option value="KS">KS</option><option value="KY">KY</option><option value="LA">LA</option><option value="ME">ME</option><option value="MD">MD</option><option value="MA">MA</option><option value="MI">MI</option><option value="MN">MN</option><option value="MS">MS</option><option value="MO">MO</option><option value="MT">MT</option><option value="NE">NE</option><option value="NV">NV</option><option value="NH">NH</option><option value="NJ">NJ</option><option value="NM">NM</option><option value="NY">NY</option><option value="NC">NC</option><option value="ND">ND</option><option value="OH">OH</option><option value="OK">OK</option><option value="OR">OR</option><option value="PA">PA</option><option value="RI">RI</option><option value="SC">SC</option><option value="SD">SD</option><option value="TN">TN</option><option value="TX">TX</option><option value="UT">UT</option><option value="VT">VT</option><option value="VA">VA</option><option value="WA">WA</option><option value="WV">WV</option><option value="WI">WI</option><option value="WY">WY</option></select></div>
<div><label>ZIP</label><input type="text" id="pocZipCode" placeholder="32830"></div>
</div>
<div class="row"><div><label>Teléfono</label><input type="text" id="pocPhone" placeholder="4075551234"></div><div class="checkbox-group" style="margin-top:24px"><input type="checkbox" id="pocEmailNA"><label for="pocEmailNA">Sin Email</label></div><div><label>Email</label><input type="email" id="pocEmail"></div></div>
</div>
